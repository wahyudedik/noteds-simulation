# ============================================================
# NotEDs — Nginx Static Cache & Performance Configuration
# ============================================================
# Add this to your nginx server block or include it via:
#   include /path/to/noteds/deploy/nginx-static-cache.conf;
# ============================================================

# --- Gzip Compression ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

# --- Cache Thumbnail Images (30 days) ---
# Thumbnails are versioned by filename (thumb_xxx.webp), so immutable cache is safe
location ~* /storage/thumbnails/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Cache Simulation Extracted Assets (7 days) ---
# Simulation ZIPs are versioned, extracted files rarely change
location ~* /storage/simulations/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Cache Static Assets (Vite build) — 1 year immutable ---
location ~* /build/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Cache Public Static Files (favicon, logo, etc) ---
location ~* \.(ico|jpeg|jpg|png|gif|webp|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Security Headers ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;

