# ============================================================
# NotEDs — Nginx Performance Configuration (Server Block Level)
# ============================================================
# Copied to: /www/server/panel/vhost/nginx/extension/noteds.com/performance.conf
# Included via: include /www/server/panel/vhost/nginx/extension/noteds.com/*.conf;
# ============================================================

# --- Cache Thumbnail Images (WebP variants) — 30 days immutable ---
# Thumbnails are generated with unique filenames (thumb_xxx.webp), safe for immutable cache
location ~* /storage/thumbnails/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Cache Vite Build Assets — 1 year immutable ---
# Build assets have content-hash filenames (app-D2lwvE2z.css), safe for long cache
location ~* /build/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Cache WebP images — 30 days ---
location ~* \.webp$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Cache Fonts — 1 year immutable ---
location ~* \.(woff|woff2|ttf|eot|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    access_log off;
}

# --- Security Headers ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
